name: Build Project

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - windows
        - linux
        - macos
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    # development is the active integration branch; every push builds.
    # No `paths:` filter — workflow edits, build scripts, and the docket all
    # warrant a full validation, and "did this break the build?" should be a
    # signal we get on every commit, not a per-commit decision.
    branches:
      - development

# Single source of truth for the Godot version — every job that installs Godot
# reads these. Keep in sync with the project's config/features in project.godot.
env:
  GODOT_VERSION: "4.6.2"
  GODOT_RELEASE: "stable"

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test secret history gate
        run: python3 tests/test_secret_scan.py
      - name: Scan outgoing push range or manual full history
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
        run: scripts/scan-secret-history-ci.sh

  build-godot-cef:
    uses: ./.github/workflows/godot-cef.yml
    with:
      skip_macos: true

  build-mcp-schema-helpers:
    name: MCP schema helper (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: windows-x86_64
            runner: windows-latest
          - target: macos-arm64
            runner: macos-15
          - target: macos-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SCons
        run: python -m pip install scons
      - name: Verify pinned MCP protocol artifacts
        shell: bash
        run: scripts/acquire-mcp-schema.sh
      - name: Verify contributor helper setup (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/build-extensions.sh --helper-only
          scripts/build-extensions.sh --check --helper-only
      - name: Verify contributor helper setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-extensions.ps1 -HelperOnly
          ./scripts/build-extensions.ps1 -Check -HelperOnly
      - name: Build pinned MCP schema helper
        shell: bash
        run: scripts/build-mcp-schema-helper.sh "${{ matrix.target }}"
      - name: Check contributor rerun safety
        run: python tests/test_contributor_setup.py
      - name: Test native helper contract
        shell: bash
        run: |
          scripts/test-packaged-mcp-helper.sh "${{ matrix.target }}" \
            "src/native/json_schema_helper/dist/${{ matrix.target }}"
      - name: Upload source-built helper
        uses: actions/upload-artifact@v4
        with:
          name: minerva-json-schema-helper-${{ matrix.target }}
          path: |
            src/native/json_schema_helper/artifacts/minerva-json-schema-helper-${{ matrix.target }}.tar.gz
            src/native/json_schema_helper/artifacts/minerva-json-schema-helper-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  check-gdextension:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            git diff --name-only HEAD^ HEAD > changes.txt
            if grep -q "src/gdextension/" changes.txt; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-windows:
    needs: check-gdextension
    if: (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    
    - name: Cache SCons build
      uses: actions/cache@v4
      with:
        path: |
          src/.sconsign.dblite
          src/**/*.os
          src/**/*.obj
        key: ${{ runner.os }}-scons-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-scons-

    - name: Cache godot-cpp
      uses: actions/cache@v4
      with:
        path: |
          src/godot-cpp/bin/**
          src/godot-cpp/gen/**
        key: ${{ runner.os }}-godot-cpp-${{ hashFiles('src/godot-cpp/**/*.cpp', 'src/godot-cpp/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-godot-cpp-
        
    - name: Setup Python and SCons
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - run: pip install scons

    # ── ghostty-vt shim (Windows) — DE-RISK STEP ──────────────────────────
    # The Windows terminal historically shipped without ghostty-vt entirely
    # (no Zig build here, no shim DLL), while the live renderer drives the
    # terminal through the ghostty-vt cell-grid API. This step proves the
    # shim cross-compiles to minerva-vt.dll on windows-latest before we
    # rewrite windows/terminal.cpp to use it. SConstruct does NOT yet link
    # the shim on Windows, so this DLL is currently a packaged-but-unused
    # sidecar — that's intentional for this pass.
    - name: Setup Zig
      shell: pwsh
      run: |
        $ZigVersion = "0.15.2"
        $url = "https://ziglang.org/download/$ZigVersion/zig-x86_64-windows-$ZigVersion.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\zig.zip"
        Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig" -Force
        $zigExe = Get-ChildItem -Recurse -Path "$env:RUNNER_TEMP\zig" -Filter zig.exe | Select-Object -First 1
        if (-not $zigExe) { Write-Error "zig.exe not found after extraction"; exit 1 }
        Add-Content -Path $env:GITHUB_PATH -Value $zigExe.Directory.FullName
        & $zigExe.FullName version

    - name: Cache Zig build
      uses: actions/cache@v4
      with:
        path: src/gdextension/terminal/ghostty-shim/.zig-cache
        key: zig-windows-x86_64-${{ hashFiles('src/gdextension/terminal/ghostty-shim/build.zig', 'src/gdextension/terminal/ghostty-shim/src/**') }}
        restore-keys: zig-windows-x86_64-

    - name: Build ghostty-vt shim (Windows)
      shell: pwsh
      working-directory: src/gdextension/terminal/ghostty-shim
      run: |
        # Two Windows-specific flags:
        #
        # 1. --global-cache-dir on D:  — Zig 0.15.2's
        #    std.Build.Step.Run.convertPathArg panics (assert !isAbsolute)
        #    when the build straddles drives (workspace/local cache on D:\a,
        #    global cache defaults to C:\...\AppData\Local\zig). Cross-drive
        #    paths can't be made relative on Windows. Keep all caches on D:.
        #
        # 2. -Dtarget=x86_64-windows-msvc — pins the DLL's runtime CRT to the
        #    OS-provided UCRT (vs the gnu/MinGW msvcrt). NOTE: this does NOT
        #    make the link work — ghostty-vt is an LLD-built lib, and MSVC
        #    link.exe cannot consume EITHER ABI's LLD-format import lib (it
        #    breaks default-lib resolution -> 103 unresolved CRT/kernel32
        #    externals). The next step regenerates a native MSVC import lib;
        #    that is the actual fix. (Ghostty itself only ever links libghostty-vt
        #    via the Zig/clang toolchain, never MSVC.)
        zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows-msvc --global-cache-dir "$env:GITHUB_WORKSPACE\.zig-global-cache"
        Write-Host "--- zig-out tree ---"
        Get-ChildItem -Recurse zig-out | Select-Object FullName

    - name: Copy shim library to bin
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path src/bin | Out-Null
        # Zig may place the DLL under zig-out/bin or zig-out/lib depending on
        # target/ABI — find it wherever it landed.
        $dll = Get-ChildItem -Recurse -Path src/gdextension/terminal/ghostty-shim/zig-out -Filter minerva-vt.dll | Select-Object -First 1
        if (-not $dll) { Write-Error "minerva-vt.dll not produced by zig build"; exit 1 }
        Copy-Item $dll.FullName src/bin/
        Get-ChildItem src/bin

    - name: Regenerate MSVC-native import lib for the shim
      shell: pwsh
      run: |
        # MSVC link.exe cannot consume Zig/LLD's import lib — its directives
        # break default-library resolution, so godot-cpp's own CRT + kernel32
        # come back unresolved (103 LNK2019/LNK2001). ghostty-vt is only ever
        # linked via the Zig/clang toolchain upstream; MSVC consumption is on us.
        # Fix: regenerate a clean, native MSVC import lib from the DLL's actual
        # exports (dumpbin -> .def -> lib.exe) and overwrite Zig's lib in place,
        # so SConstruct's LIBPATH/LIBS resolve a link.exe-friendly archive with
        # no source or SConstruct change. Auto-generated from the DLL, so the
        # export list never drifts from the shim's API.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -property installationPath
        Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
        Enter-VsDevShell -VsInstallPath $vsPath -DevCmdArguments "-arch=x64 -host_arch=x64" -SkipAutomaticLocation | Out-Null

        $shim   = "src\gdextension\terminal\ghostty-shim\zig-out"
        $dll    = Join-Path $shim "bin\minerva-vt.dll"
        $defOut = Join-Path $shim "lib\minerva-vt.def"
        $libOut = Join-Path $shim "lib\minerva-vt.lib"

        # Pull the exported C symbols straight from the built DLL (source of truth).
        $names = & dumpbin /exports $dll | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(minerva_vt\w*)') { $Matches[1] }
        }
        if (-not $names) { Write-Error "No minerva_vt* exports found in $dll"; exit 1 }
        Write-Host "Exports ($($names.Count)): $($names -join ', ')"

        # LIBRARY pins the import lib to minerva-vt.dll (bundled next to the exe
        # at runtime via terminal.gdextension [dependencies]).
        @("LIBRARY minerva-vt", "EXPORTS") + $names | Set-Content -Path $defOut -Encoding ascii
        & lib /def:$defOut /machine:x64 /out:$libOut
        if (-not (Test-Path $libOut)) { Write-Error "lib.exe did not produce $libOut"; exit 1 }
        Write-Host "Regenerated MSVC import lib:"; Get-Item $libOut

    - name: Build Extension
      run: |
        cd src
        scons platform=windows target=template_release
        scons platform=windows target=template_debug

    - name: Upload Extension
      uses: actions/upload-artifact@v4
      with:
        name: terminal-windows
        path: |
          src/bin/libterminal*
          src/bin/minerva-vt.dll

  build-linux:
    needs: check-gdextension
    if: (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Cache SCons build
      uses: actions/cache@v4
      with:
        path: |
          src/.sconsign.dblite
          src/**/*.os
          src/**/*.obj
        key: ${{ runner.os }}-scons-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-scons-

    - name: Cache godot-cpp
      uses: actions/cache@v4
      with:
        path: |
          src/godot-cpp/bin/**
          src/godot-cpp/gen/**
        key: ${{ runner.os }}-godot-cpp-${{ hashFiles('src/godot-cpp/**/*.cpp', 'src/godot-cpp/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-godot-cpp-

    - name: Setup Zig
      run: |
        ZIG_VERSION="0.15.2"
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)   ZIG_PLATFORM="x86_64-linux" ;;
          Linux-aarch64)  ZIG_PLATFORM="aarch64-linux" ;;
          Darwin-x86_64)  ZIG_PLATFORM="x86_64-macos" ;;
          Darwin-arm64)   ZIG_PLATFORM="aarch64-macos" ;;
        esac
        curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_PLATFORM}-${ZIG_VERSION}.tar.xz"
        tar xf /tmp/zig.tar.xz -C /tmp
        # $GITHUB_PATH only takes effect on subsequent steps; export in-step too so the validation runs.
        ZIG_DIR="/tmp/zig-${ZIG_PLATFORM}-${ZIG_VERSION}"
        export PATH="$ZIG_DIR:$PATH"
        echo "$ZIG_DIR" >> $GITHUB_PATH
        zig version

    - name: Cache Zig build
      uses: actions/cache@v4
      with:
        path: src/gdextension/terminal/ghostty-shim/.zig-cache
        key: zig-linux-x86_64-${{ hashFiles('src/gdextension/terminal/ghostty-shim/build.zig', 'src/gdextension/terminal/ghostty-shim/src/**') }}
        restore-keys: zig-linux-x86_64-

    - name: Setup Python and SCons
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - run: pip install scons

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential util-linux

    - name: Build ghostty-vt shim
      working-directory: src/gdextension/terminal/ghostty-shim
      # -Dcpu=baseline: without it Zig targets this runner's native CPU, and
      # the functional-tests job (another runner) can die with SIGILL.
      run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

    - name: Copy shim library to bin
      run: |
        mkdir -p src/bin
        cp src/gdextension/terminal/ghostty-shim/zig-out/lib/libminerva-vt.so src/bin/

    - name: Build Extension
      run: |
        cd src
        scons platform=linux target=template_release
        scons platform=linux target=template_debug

    - name: Upload Extension
      uses: actions/upload-artifact@v4
      with:
        name: terminal-linux
        path: |
          src/bin/libterminal*
          src/bin/libminerva-vt.so

  # ── Functional regression test suite (RCA 019e46b5) ──────────────────────
  # CI ran zero tests before this job. Runs the hermetic substrate tier
  # (F1-F6) — fixture-plugin tests on the real MCPServerConnection. The
  # per-plugin tier (CAD / presentation / scansort) is heavy/networked and is
  # left for a manual/nightly run: scripts/run-functional-tests.sh --all.
  functional-tests:
    needs: [build-linux, build-mcp-schema-helpers, build-godot-cef]
    if: (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    # The hermetic tests spawn an MCP stdio subprocess, which needs the
    # SubProcess GDExtension shipped in the terminal-linux artifact.
    - name: Download terminal extension
      uses: actions/download-artifact@v4
      with:
        name: terminal-linux
        path: src/bin/

    - name: Download source-built MCP schema helper
      uses: actions/download-artifact@v4
      with:
        name: minerva-json-schema-helper-linux-x86_64
        path: mcp-schema-helper

    - name: Install MCP schema helper for host tests
      run: |
        archive=mcp-schema-helper/minerva-json-schema-helper-linux-x86_64.tar.gz
        expected=$(tr -d '\r\n' < "$archive.sha256")
        actual=$(sha256sum "$archive" | cut -d' ' -f1)
        [ "$actual" = "$expected" ]
        mkdir -p /tmp/mcp-schema-helper
        tar -xzf "$archive" -C /tmp/mcp-schema-helper
        cp /tmp/mcp-schema-helper/minerva-json-schema-helper src/bin/
        chmod +x src/bin/minerva-json-schema-helper

    # The suites run the real host chain (Docket → godot-sqlite, editors →
    # godot_cef, media → FFmpeg). Without these GDExtensions the
    # dependent scripts fail to compile and every suite prints SCRIPT ERROR
    # lines, which the runner treats as a failure. Fetch them exactly as
    # build-godot does, so the functional tier sees the project a build sees.
    - name: Download godot-sqlite addon
      run: |
        SQLITE_VERSION="v4.7"
        SQLITE_URL="https://github.com/2shady4u/godot-sqlite/releases/download/${SQLITE_VERSION}/bin.zip"
        curl -fL -o /tmp/sqlite.zip "$SQLITE_URL"
        unzip -o /tmp/sqlite.zip -d /tmp/sqlite-extract >/dev/null
        mkdir -p src/addons/godot-sqlite/bin
        cp -r /tmp/sqlite-extract/bin/* src/addons/godot-sqlite/bin/
        ls src/addons/godot-sqlite/bin/ | head -20

    - name: Download EIRTeam.FFmpeg
      run: |
        FFMPEG_URL="https://github.com/EIRTeam/EIRTeam.FFmpeg/releases/download/autobuild-2025-11-12-13-44/eirteam-ffmpeg-1.1.4.zip"
        curl -L -o /tmp/ffmpeg.zip "$FFMPEG_URL"
        unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract >/dev/null
        FFMPEG_SRC=$(find /tmp/ffmpeg-extract -name "ffmpeg.gdextension" -exec dirname {} \; | head -1)
        mkdir -p src/addons/ffmpeg/linux64
        cp -r "$FFMPEG_SRC/linux64/"* src/addons/ffmpeg/linux64/
        ls src/addons/ffmpeg/linux64/ | head -20

    - name: Download godot-cef artifacts (Linux)
      uses: actions/download-artifact@v4
      with:
        name: godot-cef-linux-x86_64
        path: src/addons/godot_cef/bin/x86_64-unknown-linux-gnu

    - name: Install Linux runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libx11-dev libxcursor-dev \
          libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev \
          libdbus-1-dev libudev-dev libxi-dev libxrandr-dev \
          libgtk-3-0

    - name: Install Godot 4.6
      run: |
        curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
        unzip ./godot.zip
        sudo mv ./Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
        godot --version

    - name: Import project
      working-directory: src
      run: |
        mkdir -p .godot
        # Two passes: the first registers extensions and global classes, the
        # second imports everything those made loadable. A failed import is a
        # failed job — the suites would only report it as SCRIPT ERROR noise.
        timeout 600s godot --headless --import --path .
        timeout 600s godot --headless --import --path .
        test -n "$(ls .godot/imported 2>/dev/null)" || { echo "::error::import produced no resources"; exit 1; }

    # These guards are owned by minerva-plugins, but deliberately run here
    # against this exact, already-built host. Keep the revision immutable so a
    # plugin change cannot turn a Minerva commit red without a reviewed pin.
    - name: Checkout pinned plugin contract guards
      env:
        PLUGIN_GUARD_REV: 3001ff17a6460f61b0c8067810f69ffe8a07e15c
      run: |
        plugin_root="$GITHUB_WORKSPACE/../minerva-plugins"
        rm -rf "$plugin_root"
        git init "$plugin_root"
        git -C "$plugin_root" remote add origin https://github.com/imrans-lab/minerva-plugins.git
        git -C "$plugin_root" fetch --depth=1 origin "$PLUGIN_GUARD_REV"
        git -C "$plugin_root" checkout --detach FETCH_HEAD
        actual=$(git -C "$plugin_root" rev-parse HEAD)
        [ "$actual" = "$PLUGIN_GUARD_REV" ] || {
          echo "::error::plugin guard checkout is $actual, expected $PLUGIN_GUARD_REV"
          exit 1
        }

    - name: Set up Go for plugin contract guards
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: false

    - name: Set up Python for plugin contract guards
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Rust for plugin contract guards
      uses: dtolnay/rust-toolchain@stable

    - name: Run pinned plugin contract guards against this host
      env:
        PLUGIN_GUARD_REV: 3001ff17a6460f61b0c8067810f69ffe8a07e15c
      run: |
        # The runner builds each selected worker from its reviewed manifest,
        # uses an isolated user profile, and records both repository revisions
        # and every verdict in summary.json. The outer deadline bounds the
        # complete four-plugin build/run rather than only each Godot process.
        timeout --kill-after=30s 2700s \
          "$GITHUB_WORKSPACE/../minerva-plugins/scripts/run-contract-guards.sh" \
          --minerva "$GITHUB_WORKSPACE" \
          --godot /usr/local/bin/godot \
          --plugin-rev "$PLUGIN_GUARD_REV" \
          --plugins "cad council drive pcb" \
          --timeout 600 \
          --out "$RUNNER_TEMP/minerva-plugin-contract-guards"

    - name: Upload plugin contract guard verdicts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: minerva-plugin-contract-guards
        path: |
          ${{ runner.temp }}/minerva-plugin-contract-guards/summary.json
          ${{ runner.temp }}/minerva-plugin-contract-guards/logs/
        if-no-files-found: warn
        retention-days: 14

    - name: No-bleed guard (codetools extraction, DCR 019e7b6609 P2.3)
      run: scripts/check-no-codetools-bleed.sh

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run functional suite (hermetic substrate and TurnRock)
      run: scripts/run-functional-tests.sh

    # Quarantine: test_host_capability_terminal_io.gd is known-flaky — an
    # intermittent native SIGABRT (exit 134), not an assertion failure, seen
    # on 2 CI runs on diffs that never touched terminal code (both rerun-
    # green). Not reproduced locally in 40 runs (20 sequential + 20 at 4x
    # parallelism). Pulled out of HERMETIC_TESTS in run-functional-tests.sh so
    # its red cannot attribute to an unrelated PR's functional gate, but it
    # still runs on every push, in its own step, so a real terminal-capability
    # regression stays visible (continue-on-error keeps this step from
    # failing the job; it does not hide a failure — see the step's own
    # status). Bug 019fbd21a8717702931647025aae6be7.
    - name: "quarantined-flaky: terminal_io (019fbd21a8)"
      continue-on-error: true
      run: scripts/run-functional-tests.sh --quarantined

  # ── Tarball end-to-end smoke (Layer B for DCR3) ──────────────────────────
  # Drives the released Linux tarball through the production marketplace flow:
  # install scansort via MCP, start it, assert RUNNING. Catches regressions
  # like the 2026-05-26 user://-vs-OS-absolute data_directory bug that escaped
  # the unit/headless tests because side-load and marketplace install set
  # data_directory differently — only marketplace exercises the user:// path.
  #
  # Runs after build-godot publishes Minerva-Linux-Build (NOT create-release):
  # smoke fires on every push, not just push events that create releases.
  tarball-smoke:
    needs: build-godot
    if: (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/tarball-smoke.sh

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: Minerva-Linux-Build
          path: downloads/Minerva-Linux-Build

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          # Runtime libs that Minerva.x86_64 dlopens via GDExtensions: GTK and
          # Chromium-based CEF. xvfb provides a
          # virtual X display so godot-cef's gdcef_helper child processes
          # can complete their ANGLE/EGL handshake (--headless alone isn't
          # enough — see scripts/tarball-smoke.sh comments).
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1

      - name: Extract release archive
        run: |
          mkdir -p downloads/Minerva-Linux-Build/extracted
          tar -xzf downloads/Minerva-Linux-Build/Minerva-Linux.tar.gz \
            -C downloads/Minerva-Linux-Build/extracted
          test -x downloads/Minerva-Linux-Build/extracted/Minerva.x86_64
          # Required plugins are fetched from their own releases, never shipped.
          test ! -e downloads/Minerva-Linux-Build/extracted/builtin-plugins
          ls -la downloads/Minerva-Linux-Build/extracted/Minerva.x86_64

      - name: Run tarball smoke
        run: |
          chmod +x scripts/tarball-smoke.sh
          scripts/tarball-smoke.sh downloads/Minerva-Linux-Build/extracted

      - name: Upload minerva.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tarball-smoke-minerva-log
          path: /tmp/minerva-smoke-final.log
          if-no-files-found: warn

  build-macos:
    needs: check-gdextension
    if: (github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    # Pinned to macos-15: macos-latest moved to macos-26 (Xcode 26 SDK), which
    # Zig 0.15.2 cannot link against — the ghostty-vt shim fails with undefined
    # libSystem symbols (_getcwd, _waitpid, _sigaction, ...). Revisit when Zig
    # is upgraded to a version that supports the macOS 26 SDK.
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Cache SCons build
      uses: actions/cache@v4
      with:
        path: |
          src/.sconsign.dblite
          src/**/*.os
          src/**/*.obj
        key: ${{ runner.os }}-scons-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-scons-

    - name: Cache godot-cpp
      uses: actions/cache@v4
      with:
        path: |
          src/godot-cpp/bin/**
          src/godot-cpp/gen/**
        key: ${{ runner.os }}-godot-cpp-${{ hashFiles('src/godot-cpp/**/*.cpp', 'src/godot-cpp/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-godot-cpp-

    - name: Setup Zig
      run: |
        ZIG_VERSION="0.15.2"
        case "$(uname -s)-$(uname -m)" in
          Darwin-x86_64)  ZIG_PLATFORM="x86_64-macos" ;;
          Darwin-arm64)   ZIG_PLATFORM="aarch64-macos" ;;
        esac
        curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_PLATFORM}-${ZIG_VERSION}.tar.xz"
        tar xf /tmp/zig.tar.xz -C /tmp
        # $GITHUB_PATH only takes effect on subsequent steps; export in-step too so the validation runs.
        ZIG_DIR="/tmp/zig-${ZIG_PLATFORM}-${ZIG_VERSION}"
        export PATH="$ZIG_DIR:$PATH"
        echo "$ZIG_DIR" >> $GITHUB_PATH
        zig version

    - name: Cache Zig build
      uses: actions/cache@v4
      with:
        path: src/gdextension/terminal/ghostty-shim/.zig-cache
        key: zig-macos-${{ hashFiles('src/gdextension/terminal/ghostty-shim/build.zig', 'src/gdextension/terminal/ghostty-shim/src/**') }}
        restore-keys: zig-macos-

    - name: Setup Python and SCons
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - run: pip install scons

    - name: Build ghostty-vt shim (universal)
      working-directory: src/gdextension/terminal/ghostty-shim
      run: |
        zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
        cp zig-out/lib/libminerva-vt.dylib ../libminerva-vt-arm64.dylib
        zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
        cp zig-out/lib/libminerva-vt.dylib ../libminerva-vt-x86_64.dylib

    - name: Create universal binary
      working-directory: src/gdextension/terminal
      run: |
        lipo -create libminerva-vt-arm64.dylib libminerva-vt-x86_64.dylib \
             -output libminerva-vt.dylib
        # cwd is src/gdextension/terminal, target is src/bin (where SConstruct
        # looks for the universal lipo'd dylib — see src/SConstruct:67). Need
        # two `..` to reach src/, not one (which would land in src/gdextension/bin/
        # and SConstruct would fall back to the wrong-arch per-target zig-out lib).
        mkdir -p ../../bin
        cp libminerva-vt.dylib ../../bin/
        # SConstruct's LIBPATH is ghostty-shim/zig-out/lib/ — at this point
        # that file is the x86_64 dylib from the last `zig build` above. ld
        # on macos-latest (arm64) refuses to link against it ("ignoring file
        # ... built for macOS-x86_64"), and the resulting libterminal
        # framework binary is missing all minerva-vt symbols. Replace it with
        # the universal binary so scons links successfully against an arm64
        # slice and the runtime dlopen finds the symbols.
        cp libminerva-vt.dylib ghostty-shim/zig-out/lib/libminerva-vt.dylib

    - name: Build Extension
      run: |
        cd src
        scons platform=macos target=template_release
        scons platform=macos target=template_debug

    - name: Upload Extension
      uses: actions/upload-artifact@v4
      with:
        name: terminal-macos
        path: |
          src/bin/libterminal*
          src/bin/libminerva-vt.dylib

  # ─── macOS Godot export — runs on macos-latest so Godot's exporter can
  # bundle GDExtension Frameworks correctly. The previous setup ran the
  # macOS export from ubuntu-latest in build-godot, which produced a stub
  # .app missing all Contents/Frameworks/* (libterminal, libminerva-vt,
  # Godot CEF.framework, libgdsqlite framework, ffmpeg).
  # That stub crashed in user GDScript after ~30s when scripts dereferenced
  # classes from the missing extensions. (DCR 019e5ce2160f item #3.)
  export-macos:
    needs: [check-gdextension, build-macos, build-mcp-schema-helpers]
    if: (github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    # Pinned to macos-15 to match build-macos (macos-26/Xcode-26 SDK breaks the
    # Zig 0.15.2 ghostty-vt shim link).
    runs-on: macos-15
    env:
      BLUETOOTH_USAGE: Minerva connects to Bluetooth bench instruments such as multimeters through its plugins.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          lfs: true

      - name: Download MCP schema helpers
        uses: actions/download-artifact@v4
        with:
          pattern: minerva-json-schema-helper-macos-*
          path: mcp-schema-helpers

      - name: Download terminal-macos extension
        uses: actions/download-artifact@v4
        with:
          name: terminal-macos
          path: src/bin/

      - name: Patch godot_cef.gdextension for macOS
        # The CEF framework `Godot CEF.framework` does NOT follow the standard
        # macOS framework convention (binary named `Foo` matching the
        # framework basename). Its `Info.plist` declares
        # `CFBundleExecutable = libgdcef.dylib` and the actual binary is
        # `Godot CEF.framework/libgdcef.dylib`. Godot's exporter and dyld
        # both assume the convention — they look for `Godot CEF.framework/
        # Godot CEF` and fail with:
        #   LipO: Can't open file: ".../Godot CEF.framework/Godot CEF"
        #   dlopen: ... (not a file)
        # gdcef's own rust code documents the expected load path at
        # `crates/gdcef/src/utils.rs:62-63`:
        #   project/addons/godot_cef/bin/universal-apple-darwin/Godot CEF.framework/libgdcef.dylib
        # So the .gdextension is wrong as shipped — it should point at the
        # dylib directly, not the framework dir. Patch it at CI time.
        #
        # Also strip the [dependencies] macos block: Godot's exporter
        # bundles the whole framework dir into Contents/Frameworks/ and
        # mangles its internal layout (Info.plist gets regenerated,
        # symlinks get lost). We rsync the framework + helper app manually
        # after export, preserving structure faithfully.
        run: |
          GDEXT=src/addons/godot_cef/godot_cef.gdextension
          # Step 1: patch [libraries] macos to point at the actual dylib.
          # The existing line has many spaces between `macos` and `=`, so
          # match a flexible-whitespace pattern.
          sed -i.bak -E 's|^macos([[:space:]]*)=([[:space:]]*)"bin/universal-apple-darwin/Godot CEF\.framework"$|macos\1=\2"bin/universal-apple-darwin/Godot CEF.framework/libgdcef.dylib"|' "$GDEXT"
          rm -f "$GDEXT.bak"
          # Step 2: strip the multi-line [dependencies] macos block.
          # `^macos = \{` requires an open brace so we don't match the
          # [libraries] line above (which has quoted-string value).
          awk '
            /^macos = \{/ { skip = 1; next }
            skip && /^[[:space:]]*\}/ { skip = 0; next }
            skip { next }
            { print }
          ' "$GDEXT" > "$GDEXT.new"
          mv "$GDEXT.new" "$GDEXT"
          echo "--- godot_cef.gdextension after patch ---"
          cat "$GDEXT"
          # Sanity check: confirm the macos line now points at libgdcef.dylib.
          if ! grep -q '^macos.*libgdcef\.dylib"$' "$GDEXT"; then
            echo "::error::[libraries] macos line did not get patched to libgdcef.dylib"
            exit 1
          fi

      - name: Verify pre-export bin contents
        run: |
          ls -la src/bin/
          # The libterminal.macos.template_release.framework artifact directory
          # must contain BOTH the dylib AND the libminerva-vt.dylib copied in
          # via SConstruct's AddPostAction; this is what enables runtime
          # @rpath resolution from libterminal.
          for fw in libterminal.macos.template_release.framework libterminal.macos.template_debug.framework; do
            if [ -d "src/bin/$fw" ]; then
              echo "Framework $fw contents:"
              ls -la "src/bin/$fw"
            else
              echo "::warning::Framework missing: src/bin/$fw"
            fi
          done

      - name: Setup Python and SCons (for ffmpeg gdextension build)
        # macos-latest's system Python rejects `pip install` per PEP 668
        # (externally-managed environment). scripts/build-ffmpeg.sh calls
        # `pip3 install scons` unconditionally, so install Python via
        # actions/setup-python (its venv is not PEP-668-locked) and pre-
        # install scons here so the script's pip step is a no-op.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install scons

      - name: Initialize EIRTeam.FFmpeg submodule (macOS from-source)
        # Upstream's autobuild release ships linux64 + win64 only — no
        # macOS framework. We build from source via scripts/build-ffmpeg.sh,
        # which compiles ffmpeg-kit (FFmpeg + x264 + x265 + vpx + opus +
        # vorbis etc.) for both arm64 and x86_64. Cold build is 30-60min;
        # cached after.
        run: |
          git submodule update --init --recursive vendor/EIRTeam.FFmpeg

      - name: Compute EIRTeam.FFmpeg submodule SHA
        # Use the submodule SHA as the cache key so a submodule bump
        # invalidates the cache and triggers a rebuild automatically.
        id: ffmpeg-sha
        run: |
          SHA=$(git ls-tree HEAD vendor/EIRTeam.FFmpeg | awk '{print $3}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "EIRTeam.FFmpeg submodule SHA: $SHA"

      - name: Cache EIRTeam.FFmpeg built addon (macOS)
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: src/addons/ffmpeg/macos
          key: ffmpeg-macos-universal-${{ steps.ffmpeg-sha.outputs.sha }}

      - name: Build EIRTeam.FFmpeg from source (macOS)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        # Cold build path: ffmpeg-kit + GDExtension wrapper, 30-60min.
        # The script handles brew deps, CMake 4.x patches for x265,
        # ad-hoc codesigns the output dylibs/frameworks. Idempotent —
        # subsequent in-step runs (same submodule SHA) become no-ops.
        run: |
          bash scripts/build-ffmpeg.sh macos

      - name: Verify FFmpeg macOS addon
        run: |
          if [ -z "$(ls src/addons/ffmpeg/macos/ 2>/dev/null)" ]; then
            echo "::error::src/addons/ffmpeg/macos/ is empty after cache/build"
            exit 1
          fi
          echo "--- FFmpeg macOS addon ---"
          ls -la src/addons/ffmpeg/macos/
          # Confirm at least one Mach-O artifact landed (framework or dylib).
          if ! find src/addons/ffmpeg/macos -maxdepth 4 \( -name '*.dylib' -o -name 'libgdffmpeg*' \) 2>/dev/null | grep -q .; then
            echo "::error::No FFmpeg dylib/framework binary found in src/addons/ffmpeg/macos/"
            find src/addons/ffmpeg/macos -maxdepth 4 | head -30
            exit 1
          fi
          binaries=(
            src/addons/ffmpeg/macos/libgdffmpeg.macos.template_debug.framework/libgdffmpeg_advanced.macos.template_debug
            src/addons/ffmpeg/macos/libgdffmpeg.macos.template_release.framework/libgdffmpeg_advanced.macos.template_release
          )
          # Match ffmpeg.gdextension's packaged runtime dependency manifest.
          # libavdevice is built in the universal intermediate but the wrapper
          # neither links nor installs it.
          for library in avcodec avfilter avformat avutil swresample swscale; do
            binaries+=("src/addons/ffmpeg/macos/lib${library}.dylib")
          done
          for binary in "${binaries[@]}"; do
            [ -f "$binary" ] || { echo "::error::Missing FFmpeg binary: $binary"; exit 1; }
            lipo "$binary" -verify_arch arm64 x86_64
          done

      - name: Save verified EIRTeam.FFmpeg addon cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/addons/ffmpeg/macos
          key: ffmpeg-macos-universal-${{ steps.ffmpeg-sha.outputs.sha }}

      - name: Download godot-sqlite addon
        run: |
          SQLITE_VERSION="v4.7"
          SQLITE_URL="https://github.com/2shady4u/godot-sqlite/releases/download/${SQLITE_VERSION}/bin.zip"
          curl -fL -o /tmp/sqlite.zip "$SQLITE_URL"
          unzip -o /tmp/sqlite.zip -d /tmp/sqlite-extract >/dev/null
          mkdir -p src/addons/godot-sqlite/bin
          cp -r /tmp/sqlite-extract/bin/* src/addons/godot-sqlite/bin/
          echo "godot-sqlite ${SQLITE_VERSION} installed"
          ls src/addons/godot-sqlite/bin/ | head -20

      - name: Build godot-cef from source (macOS)
        # The godot-cef.yml CI workflow uploads its macOS framework via
        # actions/upload-artifact, which strips macOS framework versioning
        # symlinks (Foo.framework/Foo -> Versions/Current/Foo). The
        # downloaded artifact lands without its binary, so dyld can't
        # dlopen it ("not a file" — the path is a directory missing its
        # Mach-O contents). Bypass the broken artifact pipeline entirely:
        # run scripts/build-godot-cef.sh on macos-latest, which is the
        # same script local devs run and produces a fully-formed framework.
        # The script installs Rust nightly + export-cef-dir + the CEF SDK
        # bundle if missing (~10-20min cold). Caching is a follow-up
        # optimization once we know this path produces a working bundle.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep this aligned with .github/workflows/godot-cef.yml and the
          # default in scripts/build-godot-cef.sh.
          RUST_TOOLCHAIN: nightly-2026-06-21
        run: |
          # The script auto-installs the pinned nightly via rustup, but make sure
          # rustup itself is present (it should be on macos-latest).
          command -v rustup || (echo "::error::rustup missing on macos-latest"; exit 1)
          # macos-latest is ARM64, but cef-bundler's `xtask bundle` builds a
          # universal binary by compiling BOTH x86_64-apple-darwin and
          # aarch64-apple-darwin and lipo'ing them. Each target needs its
          # rustlib (core/std/etc.) installed in the toolchain. Without
          # this, cargo emits:
          #   error[E0463]: can't find crate for `core`
          # The script installs the pinned nightly toolchain itself, but doesn't
          # add per-target stdlibs for it — do that here explicitly.
          rustup install "$RUST_TOOLCHAIN"
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-apple-darwin aarch64-apple-darwin
          bash scripts/build-godot-cef.sh macos
          echo "CEF deployed:"
          find src/addons/godot_cef/bin/universal-apple-darwin -maxdepth 4 -type d | head -20

      - name: Install Godot for macOS
        run: |
          curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_macos.universal.zip"
          unzip ./godot.zip
          # Strip quarantine xattr — otherwise Gatekeeper kills the unsigned
          # Godot binary with SIGKILL (exit 137). The release zip isn't
          # notarized, so the OS treats it as untrusted on first run.
          xattr -dr com.apple.quarantine Godot.app || true
          chmod +x "Godot.app/Contents/MacOS/Godot"
          # Run via the .app so the loader keeps relative resource resolution.
          # Symlink (not copy) so the binary still sees its bundle siblings;
          # raw copying breaks GDExtension template detection for some setups.
          sudo ln -sf "$PWD/Godot.app/Contents/MacOS/Godot" /usr/local/bin/godot
          godot --version

      - name: Install Godot Export Templates
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates"
          curl -L -o ./godot-templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip ./godot-templates.tpz
          mkdir -p "$TEMPLATE_DIR/${GODOT_VERSION}.${GODOT_RELEASE}"
          mv templates/* "$TEMPLATE_DIR/${GODOT_VERSION}.${GODOT_RELEASE}/"
          ls "$TEMPLATE_DIR/${GODOT_VERSION}.${GODOT_RELEASE}/" | head

      - name: Setup Godot Project Structure
        working-directory: src
        run: |
          mkdir -p .godot/editor
          chmod -R 777 .godot

      - name: Export Project (macOS)
        working-directory: src
        run: |
          mkdir -p build/macos
          # `--import` warms the asset cache; some imports legitimately fail
          # on headless first-run and are recovered during the export pass.
          # macos-latest doesn't ship GNU `timeout` in PATH; let `--import`
          # run to completion (it's bounded; Godot exits when done) or fail,
          # and rely on `|| true` for non-zero exits.
          godot --headless --import || true
          godot --headless --export-release "macOS" build/macos/Minerva.app
          echo "Exported .app structure (top 3 levels):"
          find build/macos/Minerva.app -maxdepth 3 -type d | sort
          echo "Total .app size:"
          du -sh build/macos/Minerva.app

      # Release gate, macOS half, on the tree the export was just made from.
      - name: Platform gate suites (macOS)
        timeout-minutes: 30
        env:
          MINERVA_TEST_LOG_DIR: ${{ runner.temp }}/platform-gate
        run: |
          archive=mcp-schema-helpers/minerva-json-schema-helper-macos-arm64/minerva-json-schema-helper-macos-arm64.tar.gz
          [ "$(shasum -a 256 "$archive" | cut -d' ' -f1)" = "$(tr -d '\r\n' < "$archive.sha256")" ]
          mkdir -p "$RUNNER_TEMP/helper" && tar -xzf "$archive" -C "$RUNNER_TEMP/helper"
          cp "$RUNNER_TEMP/helper/minerva-json-schema-helper" src/bin/
          scripts/run-functional-tests.sh --platform-gate
          rm src/bin/minerva-json-schema-helper

      # Before/after CPU of a slow download, recorded (no pass threshold).
      - name: Download CPU benchmark (macOS)
        timeout-minutes: 15
        shell: bash  # -eo pipefail: a failed benchmark must not pass through tee
        run: |
          mkdir -p "$RUNNER_TEMP/platform-gate"
          scripts/bench-plugin-download-cpu.sh 64 8 | tee "$RUNNER_TEMP/platform-gate/bench-plugin-download-cpu-macos.txt"
          { echo '### Plugin download CPU (macOS, 64 MiB at 8 MiB/s)'; echo '```'
            cat "$RUNNER_TEMP/platform-gate/bench-plugin-download-cpu-macos.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload platform gate logs (macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-gate-macos-logs
          path: ${{ runner.temp }}/platform-gate/
          if-no-files-found: warn
          retention-days: 14

      - name: Bundle godot-cef framework into exported .app
        # Godot's macOS exporter mangled the framework's internal symlinks
        # in iterations 1-10 (the bundled framework had nlink=4, missing
        # the top-level `Foo.framework/Foo` binary symlink, and dyld
        # returned `(not a file)`). We stripped [dependencies] macos from
        # godot_cef.gdextension above so Godot doesn't try to bundle it.
        # Now manually rsync the framework + helper app from the built
        # location (scripts/build-godot-cef.sh deployed them earlier) into
        # the path the .gdextension's [libraries] macos line resolves to
        # at runtime: addons/godot_cef/bin/universal-apple-darwin/. Also
        # mirror at the top of Frameworks/ in case the CEF helper-launcher
        # discovers sibling paths the chromium way (helper.app next to
        # framework). rsync -aH preserves symlinks AND hardlinks; this is
        # what the macOS framework versioning convention needs.
        working-directory: src/build/macos/Minerva.app/Contents/Frameworks
        run: |
          SRC="${GITHUB_WORKSPACE}/src/addons/godot_cef/bin/universal-apple-darwin"
          DST_REL="addons/godot_cef/bin/universal-apple-darwin"

          if [ ! -d "$SRC/Godot CEF.framework" ]; then
            echo "::error::CEF framework not built at $SRC/Godot CEF.framework"
            ls -la "$SRC/" || true
            exit 1
          fi

          mkdir -p "$DST_REL"
          rsync -aH "$SRC/Godot CEF.framework" "$DST_REL/"
          rsync -aH "$SRC/Godot CEF.app"       "$DST_REL/"
          # Top-of-Frameworks copy: helper-launcher fallback path.
          rsync -aH "$SRC/Godot CEF.framework" .
          rsync -aH "$SRC/Godot CEF.app"       .

          echo "--- Frameworks/ top ---"
          ls -la
          echo "--- Frameworks/$DST_REL/ ---"
          ls -la "$DST_REL/"

      - name: Stage source-built MCP schema helpers
        working-directory: src
        run: |
          ROOT=build/macos/Minerva.app/Contents/Resources/mcp-runtime
          for target in macos-arm64 macos-amd64; do
            artifact="${GITHUB_WORKSPACE}/mcp-schema-helpers/minerva-json-schema-helper-${target}"
            archive="$artifact/minerva-json-schema-helper-${target}.tar.gz"
            expected=$(tr -d '\r\n' < "$archive.sha256")
            actual=$(shasum -a 256 "$archive" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || { echo "::error::MCP helper checksum mismatch: $target"; exit 1; }
            mkdir -p "$ROOT/$target"
            tar -xzf "$archive" -C "$ROOT/$target"
          done

      # The agent-session launcher, image recipes and gateway policy ship in
      # Resources, never beside the signed executable (AgentSessionStore.gd).
      - name: Stage agent-session kit (macOS)
        working-directory: src
        run: ../scripts/stage-agent-kit.sh build/macos/Minerva.app/Contents/Resources

      - name: Verify CEF dylib present
        # Catch a broken bundle BEFORE the smoke launch so the failure is
        # locatable. The actual CEF binary is `libgdcef.dylib` inside the
        # framework dir (the framework is non-standard — see the "Patch
        # godot_cef.gdextension" step's comment for the full RCA). We
        # check the dylib path the .gdextension's patched [libraries]
        # macos line now resolves to at runtime.
        working-directory: src/build/macos/Minerva.app/Contents/Frameworks
        run: |
          DST_REL="addons/godot_cef/bin/universal-apple-darwin"
          FW="$DST_REL/Godot CEF.framework"
          BIN="$FW/libgdcef.dylib"

          fail=0
          if [ ! -e "$BIN" ]; then
            echo "::error::CEF dylib missing at $BIN"
            echo "Framework structure:"
            find "$FW" -maxdepth 3 2>&1 | head -30
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            file "$BIN"
            if ! file "$BIN" | grep -q "Mach-O"; then
              echo "::error::CEF dylib is not Mach-O at $BIN"
              fail=1
            fi
          fi
          [ "$fail" -eq 0 ] && echo "✓ CEF dylib OK"
          exit "$fail"

      - name: Declare Bluetooth usage in Info.plist
        # macOS charges a child process's CoreBluetooth use to the app that
        # started it, so a plugin driving a BLE instrument is aborted on its
        # first Bluetooth call unless Minerva's own Info.plist carries a usage
        # string. Godot 4.6's macOS export preset has no Bluetooth key, so the
        # exported plist lacks it and it is inserted here, before signing seals
        # the plist. The "Verify macOS build assets" step checks the exact
        # string; should a later export write the key, the preset should carry
        # it instead.
        working-directory: src/build/macos
        run: |
          plutil -insert NSBluetoothAlwaysUsageDescription -string "$BLUETOOTH_USAGE" Minerva.app/Contents/Info.plist
          plutil -lint Minerva.app/Contents/Info.plist

      - name: Ad-hoc sign app
        # Codesign iteration history (in build.yml git log):
        #   - 913b18a1: `--force --deep --sign -` → per-library Gatekeeper
        #     prompts on first launch (CEF helper subprocess spawns, each
        #     quarantined → individual prompts)
        #   - 4799a64e: `--remove-signature --deep` → "can't be opened" on
        #     Apple Silicon (arm64 binaries require AT LEAST ad-hoc
        #     signatures to execute)
        #   - 37457ad5: `--force --sign -` (no --deep) → codesign aborts
        #     because Godot's export left "Unsigned nested executable
        #     file" inside Contents/Frameworks/Godot CEF.framework; outer
        #     signing requires nested code to be in a valid signed state
        #
        # Resolution (this commit): use --deep (required to sign nested
        # unsigned binaries Godot can't handle), and document that users
        # MUST run `xattr -dr com.apple.quarantine Minerva.app` BEFORE
        # first launch to strip the quarantine attribute from every
        # nested file. Without that, each CEF helper subprocess spawn
        # triggers an independent Gatekeeper check.
        #
        # We also pre-emptively strip quarantine from the build tree
        # itself before signing — the runner shouldn't have quarantine
        # attrs but this is defense in depth in case Godot's export adds
        # any (the downloaded Godot binary did have quarantine).
        working-directory: src/build/macos
        run: |
          xattr -cr Minerva.app 2>/dev/null || true
          MCP_ROOT=Minerva.app/Contents/Resources/mcp-runtime
          for target in macos-arm64 macos-amd64; do
            codesign --force --sign - "$MCP_ROOT/$target/minerva-json-schema-helper"
          done
          codesign --force --deep --sign - Minerva.app
          codesign --verify --deep --strict Minerva.app
          echo "✓ .app signatures verified"

      - name: Package macOS Build for upload
        # actions/upload-artifact@v4 treats a single directory path as
        # "upload contents, drop wrapper", so `path: src/build/macos/Minerva.app`
        # produces a zip where Contents/, MacOS/, Resources/ appear at the
        # top level (broken — looks like a folder, not a .app, when users
        # extract). Use `ditto` to manually create a properly-structured
        # zip with the .app wrapper preserved. `ditto` is the canonical
        # macOS bundle archiver: preserves symlinks, extended attributes,
        # code signatures, resource forks, and executable bits — none of
        # which plain `zip` reliably handles.
        working-directory: src/build/macos
        run: |
          ditto -c -k --sequesterRsrc --keepParent Minerva.app Minerva-macOS.zip
          ls -lh Minerva-macOS.zip

      - name: Verify macOS build assets
        working-directory: src/build/macos
        run: |
          APP=Minerva.app
          required_files=(
            "$APP/Contents/MacOS/Minerva"
            "$APP/Contents/Resources/Minerva.pck"
            "$APP/Contents/Info.plist"
            "$APP/Contents/Resources/mcp-runtime/macos-arm64/minerva-json-schema-helper"
            "$APP/Contents/Resources/mcp-runtime/macos-amd64/minerva-json-schema-helper"
          )
          required_dirs=(
            "$APP/Contents/Frameworks"
            "$APP/Contents/Resources/mcp-runtime/macos-arm64"
            "$APP/Contents/Resources/mcp-runtime/macos-amd64"
          )
          # Critical GDExtension assets that MUST land in Contents/Frameworks/
          # — the prior bug shipped a Minerva.app with no Frameworks/ at all,
          # which booted but crashed in user GDScript after ~30s when scripts
          # dereferenced classes from missing extensions (SQLite, WebView,
          # Terminal). RCA: build-godot ran macOS export on ubuntu-latest,
          # which silently skips shared-object bundling for the macos target.
          #
          # Keep this list MINIMAL — the smoke-launch step below catches the
          # broader class of "extension X failed to load" via stdout grep.
          # Over-specifying here creates false negatives when an addon's
          # internal layout changes (e.g. cef, sqlite, ffmpeg).
          required_in_frameworks=(
            "libterminal.macos.template_release.framework"
            "libterminal.macos.template_release.framework/libterminal.macos.template_release"
            "libterminal.macos.template_release.framework/libminerva-vt.dylib"
          )
          fail=0
          for f in "${required_files[@]}"; do
            if [ ! -e "$f" ]; then echo "::error::Missing $f"; fail=1; fi
          done
          for d in "${required_dirs[@]}"; do
            if [ ! -d "$d" ]; then echo "::error::Missing dir $d"; fail=1; fi
          done
          # Required plugins are fetched from their own releases, never shipped.
          if [ -e "$APP/Contents/Resources/builtin-plugins" ]; then
            echo "::error::$APP/Contents/Resources/builtin-plugins must not be packaged"; fail=1
          fi
          if [ -d "$APP/Contents/Frameworks" ]; then
            echo "Frameworks contents:"
            ls -la "$APP/Contents/Frameworks/"
            for entry in "${required_in_frameworks[@]}"; do
              if [ ! -e "$APP/Contents/Frameworks/$entry" ]; then
                echo "::error::Frameworks/ missing: $entry"
                fail=1
              fi
            done
          fi
          declared=$(plutil -extract NSBluetoothAlwaysUsageDescription raw -o - "$APP/Contents/Info.plist" || true)
          if [ "$declared" != "$BLUETOOTH_USAGE" ]; then
            echo "::error::Info.plist NSBluetoothAlwaysUsageDescription is '$declared', expected '$BLUETOOTH_USAGE'"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "All required macOS bundle entries present"

      - name: Smoke-launch macOS build
        working-directory: src/build/macos
        run: |
          chmod +x Minerva.app/Contents/MacOS/Minerva
          # Long enough to catch deferred-call crashes that fire ~30s in
          # (the original user-reported null Array crash). 2100 frames at
          # 60fps ≈ 35s. We capture stdout/stderr and grep for the
          # extension-load + script-compile error patterns that signal
          # missing or mis-bundled GDExtensions.
          Minerva.app/Contents/MacOS/Minerva --headless --quit-after 2100 \
              > minerva-launch.log 2>&1 || true
          # Check for the specific failure modes we're guarding against.
          # As of iter 13, FFmpeg is built from source on macOS, so any
          # ffmpeg load failure is now a real regression (no longer the
          # expected "no upstream macOS framework" benign error).
          grep -E "Can't open dynamic library|GDExtension dynamic library not found|Error loading extension|Could not find type" minerva-launch.log \
              > /tmp/smoke-errors.txt || true
          if [ -s /tmp/smoke-errors.txt ]; then
            echo "::error::Extension load / type-resolution error during smoke launch"
            echo "--- offending lines ---"
            head -20 /tmp/smoke-errors.txt
            echo "--- last 200 of full launch log ---"
            tail -200 minerva-launch.log
            exit 1
          fi
          echo "Smoke launch: no extension load errors"

      - name: Upload macOS Build
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platform == 'macos' ||
          github.event.inputs.platform == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: Minerva-macOS-Build
          # Upload the pre-zipped .app. actions/upload-artifact@v4 will
          # wrap this in its own outer zip, so the user-facing download is
          # a zip containing a zip — but the inner zip preserves the .app
          # bundle correctly via ditto. The create-release step extracts
          # the inner zip directly into the release asset path.
          path: src/build/macos/Minerva-macOS.zip

      - name: Upload smoke-launch log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-log
          path: src/build/macos/minerva-launch.log
          if-no-files-found: warn

  build-godot:
    needs: [check-gdextension, build-windows, build-linux, build-mcp-schema-helpers, build-godot-cef]
    if: >-
      always() &&
      needs.build-mcp-schema-helpers.result == 'success' &&
      needs.build-godot-cef.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:  
          submodules: 'true'
          lfs: true

      - name: Download MCP schema helpers
        uses: actions/download-artifact@v4
        with:
          pattern: minerva-json-schema-helper-*-x86_64
          path: mcp-schema-helpers
      
      - name: Download Current Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: terminal-*
          path: src/bin/
          merge-multiple: true

      - name: Create and Verify Bin Directory
        run: |
          mkdir -p src/bin
          ls -la src/bin/

      - name: Download EIRTeam.FFmpeg
        run: |
          FFMPEG_URL="https://github.com/EIRTeam/EIRTeam.FFmpeg/releases/download/autobuild-2025-11-12-13-44/eirteam-ffmpeg-1.1.4.zip"
          curl -L -o /tmp/ffmpeg.zip "$FFMPEG_URL"
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
          FFMPEG_SRC=$(find /tmp/ffmpeg-extract -name "ffmpeg.gdextension" -exec dirname {} \; | head -1)
          for subdir in linux64 win64 macos; do
            if [ -d "$FFMPEG_SRC/$subdir" ]; then
              mkdir -p "src/addons/ffmpeg/$subdir"
              cp -r "$FFMPEG_SRC/$subdir/"* "src/addons/ffmpeg/$subdir/"
            fi
          done
          cp -r "$FFMPEG_SRC/macos/"*.framework "src/addons/ffmpeg/macos/" 2>/dev/null || true
          echo "FFmpeg addon installed"
          ls src/addons/ffmpeg/linux64/ src/addons/ffmpeg/win64/ src/addons/ffmpeg/macos/ 2>/dev/null | head -20

      # godot-sqlite ships pre-built binaries via upstream releases. scripts/build-extensions.sh
      # downloads these for local dev; CI does the same here so the addon binaries are present
      # at export time. Mirror the FFmpeg pattern above.
      - name: Download godot-sqlite addon
        run: |
          SQLITE_VERSION="v4.7"
          SQLITE_URL="https://github.com/2shady4u/godot-sqlite/releases/download/${SQLITE_VERSION}/bin.zip"
          curl -fL -o /tmp/sqlite.zip "$SQLITE_URL"
          unzip -o /tmp/sqlite.zip -d /tmp/sqlite-extract >/dev/null
          mkdir -p src/addons/godot-sqlite/bin
          cp -r /tmp/sqlite-extract/bin/* src/addons/godot-sqlite/bin/
          echo "godot-sqlite ${SQLITE_VERSION} installed"
          ls src/addons/godot-sqlite/bin/ | head -20

      # The same workflow run builds these source artifacts before packaging.
      # macOS builds directly in export-macos to preserve framework symlinks.
      - name: Download godot-cef Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-cef-linux-x86_64
          path: src/addons/godot_cef/bin/x86_64-unknown-linux-gnu
      - name: Download godot-cef Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-cef-windows-x86_64
          path: src/addons/godot_cef/bin/x86_64-pc-windows-msvc

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libxi-dev libxrandr-dev yasm unzip \
            libgtk-3-0
        
      - name: Install Godot
        run: |
          curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip ./godot.zip
          sudo mv ./Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Export Templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates"
          curl -L -o ./godot-templates.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip ./godot-templates.zip
          mkdir -p "$TEMPLATE_DIR/${GODOT_VERSION}.${GODOT_RELEASE}"
          mv templates/* "$TEMPLATE_DIR/${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Setup Godot Project Structure
        working-directory: src
        run: |
          mkdir -p .godot/editor
          chmod -R 777 .godot
          
      - name: Export Project
        working-directory: src
        run: |
          mkdir -p build
          timeout 20s godot --headless --import || true
          PLATFORM="${{ github.event.inputs.platform }}"
          if [ "${{ github.event_name }}" = "push" ]; then PLATFORM="all"; fi
          IS_DEV_BRANCH="${{ github.ref == 'refs/heads/development' }}"

          if [ "$PLATFORM" = "windows" ]; then
            mkdir -p build/windows
            godot --headless --export-release "Windows Release" build/windows/Minerva.exe
            if [ "$IS_DEV_BRANCH" = "true" ]; then
              mkdir -p build/windows-debug
              godot --headless --export-debug "Windows Debug" build/windows-debug/Minerva.exe
            fi
          elif [ "$PLATFORM" = "linux" ]; then
            mkdir -p build/linux
            godot --headless --export-release "Linux Release" build/linux/Minerva.x86_64
            if [ "$IS_DEV_BRANCH" = "true" ]; then
              mkdir -p build/linux-debug
              godot --headless --export-debug "Linux Debug" build/linux-debug/Minerva.x86_64
            fi
          elif [ "$PLATFORM" = "macos" ]; then
            echo "macOS export handled by export-macos job"
          else
            mkdir -p build/windows build/linux
            godot --headless --export-release "Windows Release" build/windows/Minerva.exe
            godot --headless --export-release "Linux Release" build/linux/Minerva.x86_64
            if [ "$IS_DEV_BRANCH" = "true" ]; then
              mkdir -p build/windows-debug build/linux-debug
              godot --headless --export-debug "Windows Debug" build/windows-debug/Minerva.exe
              godot --headless --export-debug "Linux Debug" build/linux-debug/Minerva.x86_64
            fi
          fi

      - name: Stage source-built MCP schema helpers
        working-directory: src
        run: |
          stage_helper() {
            target="$1"
            destination="$2/mcp-runtime/$target"
            artifact="${GITHUB_WORKSPACE}/mcp-schema-helpers/minerva-json-schema-helper-${target}"
            archive="$artifact/minerva-json-schema-helper-${target}.tar.gz"
            expected=$(tr -d '\r\n' < "$archive.sha256")
            actual=$(sha256sum "$archive" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || { echo "::error::MCP helper checksum mismatch: $target"; exit 1; }
            mkdir -p "$destination"
            tar -xzf "$archive" -C "$destination"
          }
          [ ! -d build/linux ] || stage_helper linux-x86_64 build/linux
          [ ! -d build/linux-debug ] || stage_helper linux-x86_64 build/linux-debug
          [ ! -d build/windows ] || stage_helper windows-x86_64 build/windows
          [ ! -d build/windows-debug ] || stage_helper windows-x86_64 build/windows-debug

      # The agent-session launcher, image recipes and gateway policy ship
      # beside the executable (AgentSessionStore.gd); Linux only, as agent
      # sessions need a Unix host.
      - name: Stage agent-session kit
        working-directory: src
        run: |
          for tree in build/linux build/linux-debug; do
            [ ! -d "$tree" ] || ../scripts/stage-agent-kit.sh "$tree"
          done

      # ─── Post-export verification ──────────────────────────────────────
      # RCA: prior CI builds shipped binaries missing libminerva-vt.so and
      # CEF runtime data (icudtl.dat, *.pak, locales/), because Godot's
      # exporter silently drops [dependencies] entries that don't match its
      # supported shape. These checks are the durable backstop — if a future
      # extension bump adds a sidecar that the .gdextension manifest doesn't
      # advertise, the build fails red here instead of in a user's HITL.
      - name: Verify Linux build assets
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platform == 'linux' ||
          github.event.inputs.platform == 'all'
        working-directory: src/build/linux
        run: |
          required_files=(
            Minerva.x86_64
            libterminal.linux.template_release.x86_64.so
            libminerva-vt.so
            libcef.so
            libgdcef.so
            gdcef_helper
            v8_context_snapshot.bin
            vk_swiftshader_icd.json
            icudtl.dat
            resources.pak
            chrome_100_percent.pak
            chrome_200_percent.pak
            mcp-runtime/linux-x86_64/minerva-json-schema-helper
            mcp-runtime/linux-x86_64/SOURCE_PROVENANCE
            mcp-runtime/linux-x86_64/jsoncons-LICENSE
            agent-kit/agent-container/agent.py
            agent-kit/container-build/build.py
          )
          required_dirs=(locales)
          fail=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: src/build/linux/$f"
              fail=1
            fi
          done
          for d in "${required_dirs[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::error::Missing required directory: src/build/linux/$d"
              fail=1
            fi
          done
          # Required plugins are fetched from their own releases, never shipped.
          for tree in . ../linux-debug; do
            if [ -e "$tree/builtin-plugins" ]; then
              echo "::error::src/build/linux/$tree/builtin-plugins must not be packaged"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All required Linux runtime assets present"

      - name: Smoke-launch Linux build (extension load only)
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platform == 'linux' ||
          github.event.inputs.platform == 'all'
        working-directory: src/build/linux
        run: |
          chmod +x ./Minerva.x86_64
          # Headless --quit-after exits after N frames; enough for the
          # engine to load GDExtensions and dlopen their sidecars. Won't
          # exercise CEF init (CEF only loads when a panel opens) — file
          # presence above is the CEF backstop.
          timeout 30 ./Minerva.x86_64 --headless --quit-after 30 \
              > minerva-launch.log 2>&1 || true
          if grep -E "Can't open dynamic library|GDExtension dynamic library not found|Error loading extension" minerva-launch.log; then
            echo "::error::Extension load error during smoke launch — see log below"
            cat minerva-launch.log
            exit 1
          fi
          echo "Smoke launch: no extension load errors"

      # ── Post-export verification (Windows) ─────────────────────────────
      # De-risk backstop: confirm Godot's exporter bundled the ghostty-vt
      # shim DLL next to Minerva.exe via the [dependencies] windows.x86_64
      # entry. If this fails, the [dependencies] manifest shape is wrong for
      # Windows and the shim won't ship — caught here, before the rewrite
      # that will actually depend on it at load time.
      - name: Verify Windows build assets
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platform == 'windows' ||
          github.event.inputs.platform == 'all'
        working-directory: src/build/windows
        run: |
          required_files=(
            Minerva.exe
            libterminal.windows.template_release.x86_64.dll
            minerva-vt.dll
            mcp-runtime/windows-x86_64/minerva-json-schema-helper.exe
            mcp-runtime/windows-x86_64/SOURCE_PROVENANCE
            mcp-runtime/windows-x86_64/jsoncons-LICENSE
          )
          fail=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: src/build/windows/$f"
              fail=1
            fi
          done
          # Required plugins are fetched from their own releases, never shipped.
          for tree in . ../windows-debug; do
            if [ -e "$tree/builtin-plugins" ]; then
              echo "::error::src/build/windows/$tree/builtin-plugins must not be packaged"
              fail=1
            fi
          done
          echo "--- src/build/windows contents ---"
          ls -la
          [ "$fail" -eq 0 ] || exit 1
          echo "All required Windows runtime assets present"

      - name: Archive exported desktop builds
        working-directory: src
        run: |
          if [ -d build/linux ]; then tar -czf build/Minerva-Linux.tar.gz -C build/linux .; fi
          if [ -d build/linux-debug ]; then tar -czf build/Minerva-Linux-Debug.tar.gz -C build/linux-debug .; fi
          if [ -d build/windows ]; then (cd build/windows && zip -qr ../Minerva-Windows.zip .); fi
          if [ -d build/windows-debug ]; then (cd build/windows-debug && zip -qr ../Minerva-Windows-Debug.zip .); fi

      - name: Upload Windows Build
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platform == 'windows' ||
          github.event.inputs.platform == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: Minerva-Windows-Build
          path: src/build/Minerva-Windows.zip
          
      - name: Upload Linux Build
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platform == 'linux' ||
          github.event.inputs.platform == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: Minerva-Linux-Build
          path: src/build/Minerva-Linux.tar.gz

      # Minerva-macOS-Build is uploaded by the export-macos job (macos-latest).
      # Keeping it here would create a duplicate-artifact name conflict and
      # would re-upload an empty / Frameworks-less stub.

      - name: Upload Windows Debug Build
        if: |
          github.ref == 'refs/heads/development' && (
            github.event_name == 'push' ||
            github.event.inputs.platform == 'windows' ||
            github.event.inputs.platform == 'all'
          )
        uses: actions/upload-artifact@v4
        with:
          name: Minerva-Windows-Debug-Build
          path: src/build/Minerva-Windows-Debug.zip

      - name: Upload Linux Debug Build
        if: |
          github.ref == 'refs/heads/development' && (
            github.event_name == 'push' ||
            github.event.inputs.platform == 'linux' ||
            github.event.inputs.platform == 'all'
          )
        uses: actions/upload-artifact@v4
        with:
          name: Minerva-Linux-Debug-Build
          path: src/build/Minerva-Linux-Debug.tar.gz

  # Release gate, Windows half: marketplace install suites and native
  # SubProcess launching against this run's Windows builds. (The env context
  # is not available to a reusable-workflow call; keep equal to GODOT_VERSION.)
  platform-gate-windows:
    needs: [build-windows, build-godot-cef, build-mcp-schema-helpers]
    if: (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    uses: ./.github/workflows/platform-gate-windows.yml
    with:
      godot_version: "4.6.2"

  verify-packaged-native:
    needs: [build-godot, export-macos]
    if: always()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-packaged-native.yml
    with:
      build_run_id: ${{ github.run_id }}
      platform: ${{ github.event_name == 'push' && 'all' || github.event.inputs.platform }}
      verify_debug: ${{ github.ref == 'refs/heads/development' }}

  create-release:
    needs: [secret-history, build-godot, export-macos, verify-packaged-native, functional-tests, tarball-smoke, platform-gate-windows]
    # Releases on every development push (auto-build-<timestamp> tags) so
    # the user always has a downloadable tagged release per commit, AND on
    # explicit workflow_dispatch with create_release=true for named cuts.
    if: |
      always() &&
      needs.secret-history.result == 'success' &&
      needs.verify-packaged-native.result == 'success' &&
      needs.functional-tests.result == 'success' &&
      (needs.tarball-smoke.result == 'success' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'macos'))) &&
      ((github.event_name == 'push' && needs.build-godot.result == 'success' && needs.export-macos.result == 'success' && needs.functional-tests.result == 'success' && needs.platform-gate-windows.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' &&
        ((github.event.inputs.platform == 'all' && needs.build-godot.result == 'success' && needs.export-macos.result == 'success' && needs.functional-tests.result == 'success' && needs.platform-gate-windows.result == 'success') ||
         (github.event.inputs.platform == 'macos' && needs.export-macos.result == 'success') ||
         (github.event.inputs.platform == 'linux' && needs.build-godot.result == 'success') ||
         (github.event.inputs.platform == 'windows' && needs.build-godot.result == 'success' && needs.platform-gate-windows.result == 'success'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Minerva-*-Build
          path: downloads
          
      - name: Create Release Archives
        run: |
          mkdir -p release-assets

          # Desktop artifacts are already archived before upload so executable
          # bits and sidecar symlinks survive the Actions artifact roundtrip.
          for archive in Minerva-Windows.zip Minerva-Linux.tar.gz; do
            found=$(find downloads -name "$archive" -type f -print -quit)
            [ -z "$found" ] || cp "$found" "release-assets/$archive"
          done

          # macOS: pass through the pre-built ditto-zipped .app from
          # export-macos. The artifact contains `Minerva-macOS.zip` as a
          # file (ditto preserves the .app wrapper + symlinks + exec bits
          # + extended attrs that plain zip mangles). Just copy it to the
          # release-assets dir; re-zipping with plain `zip -r` would lose
          # the bundle structure.
          if [ -f "downloads/Minerva-macOS-Build/Minerva-macOS.zip" ]; then
            cp downloads/Minerva-macOS-Build/Minerva-macOS.zip release-assets/Minerva-macOS.zip
            echo "Copied macOS archive"
            ls -lh release-assets/Minerva-macOS.zip
          fi

          for archive in Minerva-Windows-Debug.zip Minerva-Linux-Debug.tar.gz; do
            found=$(find downloads -name "$archive" -type f -print -quit)
            [ -z "$found" ] || cp "$found" "release-assets/$archive"
          done

          echo "Final release assets:"
          ls -la release-assets/
          
      - name: Generate release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="manual-build-$(date +'%Y%m%d-%H%M%S')"
          else
            TAG="auto-build-$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # Tag the commit that was built: without this a new tag points at the
          # branch tip when the release step runs, which can be later commits.
          target_commitish: ${{ github.sha }}
          name: "Minerva Development Build ${{ steps.tag.outputs.tag }}"
          body: |
            ## Minerva Development Build

            ⚠️ **This is a development build** - expect bugs and incomplete features!

            **Build Information:**
            - Platform: ${{ github.event.inputs.platform || 'all' }}
            - Trigger: ${{ github.event_name }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            **Download Instructions:**

            **Release Builds (Optimized):**
            - **Windows**: Download `Minerva-Windows.zip`, extract and run `Minerva.exe`
            - **Linux**: Download `Minerva-Linux.tar.gz`, extract and run `./Minerva.x86_64`
            - **macOS**: Download `Minerva-macOS.zip`, extract → `Minerva.app`. The build is ad-hoc-signed (no Apple Developer cert). **Before you double-click the app**, open Terminal and run:
              ```
              xattr -dr com.apple.quarantine /path/to/Minerva.app
              ```
              This strips the download quarantine from every nested binary. If you launch the app FIRST, macOS caches "untrusted" for each CEF helper subprocess and you'll get a Gatekeeper prompt per helper. After `xattr -dr`, open normally (you'll get one "unidentified developer" prompt; bypass via right-click → Open or Settings → Privacy & Security → "Open Anyway").

            **Debug Builds (For Development - includes console output and debug symbols):**
            - **Windows Debug**: Download `Minerva-Windows-Debug.zip`, extract and run `Minerva.exe`
            - **Linux Debug**: Download `Minerva-Linux-Debug.tar.gz`, extract and run `./Minerva.x86_64`

            Built automatically from the development branch.
          files: release-assets/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
