name: Secret range scan
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scan the event commit range
      env:
        SECRET_SCAN_TARGET: development
      run: scripts/ci/scan-secrets.sh
