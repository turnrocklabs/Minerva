name: Build godot-cef

on:
  push:
    paths:
      - "vendor/godot_cef"
      - "patches/godot_cef/**"
      - "scripts/build-godot-cef.sh"
      - "src/addons/godot_cef/**"
      - ".github/workflows/godot-cef.yml"
    branches-ignore:
      - main
  pull_request:
    paths:
      - "vendor/godot_cef"
      - "patches/godot_cef/**"
      - "scripts/build-godot-cef.sh"
      - "src/addons/godot_cef/**"
      - ".github/workflows/godot-cef.yml"
  workflow_dispatch:

concurrency:
  group: godot-cef-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache key only — the binary version actually downloaded is the one
  # pinned inside scripts/build-godot-cef.sh (must match cef-dll-sys in
  # vendor/godot_cef/Cargo.lock, currently 146.5.0+146.0.10). Keep these in
  # sync so caches hit and the crate doesn't reject + re-download the archive.
  CEF_VERSION: "146.0.10"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            triple: x86_64-unknown-linux-gnu
            artifact_name: godot-cef-linux-x86_64
          - os: macos-latest
            platform: macos
            triple: universal-apple-darwin
            artifact_name: godot-cef-macos-universal
          - os: windows-latest
            platform: windows
            triple: x86_64-pc-windows-msvc
            artifact_name: godot-cef-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Add x86_64 Rust target (macOS universal build)
        if: matrix.platform == 'macos'
        shell: bash
        run: rustup target add x86_64-apple-darwin --toolchain nightly

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/godot_cef/target
          key: ${{ runner.os }}-cargo-cef-${{ hashFiles('vendor/godot_cef/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cef-

      - name: Cache CEF binary bundle
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: ${{ runner.os }}-cef-bundle-${{ env.CEF_VERSION }}

      - name: Install export-cef-dir
        shell: bash
        run: |
          if ! command -v export-cef-dir >/dev/null 2>&1; then
            cargo +nightly install export-cef-dir
          fi

      # cef-dll-sys builds CEF's C wrapper via CMake. Without an active MSVC
      # environment, the cmake/cc crates auto-detect the compiler from the new
      # VS18 preview (cl 14.51) while CMake's vs_link_exe resolves the linker
      # from VS2022 (link 14.44) — a mixed toolchain that fails the compiler
      # test ("not able to compile a simple test program"). Activate a single
      # consistent VS2022 toolchain so cl and link come from the same toolset.
      - name: Set up MSVC toolchain (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Run build script
        shell: bash
        run: |
          scripts/build-godot-cef.sh ${{ matrix.platform }}

      - name: List deployed artifacts
        shell: bash
        run: |
          ls -la src/addons/godot_cef/bin/${{ matrix.triple }}/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src/addons/godot_cef/bin/${{ matrix.triple }}/
          if-no-files-found: error
