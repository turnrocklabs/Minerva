name: Build minerva-vt

on:
  push:
    paths:
      - "src/gdextension/terminal/ghostty-shim/**"
      - "vendor/ghostty"
      - ".github/workflows/minerva-vt.yml"
    branches-ignore:
      - main
  pull_request:
    paths:
      - "src/gdextension/terminal/ghostty-shim/**"
      - "vendor/ghostty"
      - ".github/workflows/minerva-vt.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: minerva-vt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Resolve ghostty submodule commit for cache key ────────────────
  submodule-hash:
    runs-on: ubuntu-latest
    outputs:
      ghostty_hash: ${{ steps.hash.outputs.ghostty_hash }}
    steps:
      - uses: actions/checkout@v4
      - id: hash
        run: |
          HASH=$(git ls-tree HEAD vendor/ghostty | awk '{print $3}')
          echo "ghostty_hash=$HASH" >> $GITHUB_OUTPUT
          echo "Ghostty submodule pinned at: $HASH"

  # ─── Run shim unit tests (Linux, fastest runner) ───────────────────
  test:
    needs: submodule-hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          ZIG_VERSION="0.15.2"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   ZIG_PLATFORM="x86_64-linux" ;;
            Linux-aarch64)  ZIG_PLATFORM="aarch64-linux" ;;
            Darwin-x86_64)  ZIG_PLATFORM="x86_64-macos" ;;
            Darwin-arm64)   ZIG_PLATFORM="aarch64-macos" ;;
          esac
          curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_PLATFORM}-${ZIG_VERSION}.tar.xz"
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-${ZIG_PLATFORM}-${ZIG_VERSION}" >> $GITHUB_PATH
          zig version

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: |
            src/gdextension/terminal/ghostty-shim/.zig-cache
            src/gdextension/terminal/ghostty-shim/zig-out
          key: zig-test-linux-x86_64-${{ needs.submodule-hash.outputs.ghostty_hash }}-${{ hashFiles('src/gdextension/terminal/ghostty-shim/build.zig', 'src/gdextension/terminal/ghostty-shim/build.zig.zon', 'src/gdextension/terminal/ghostty-shim/src/**') }}
          restore-keys: |
            zig-test-linux-x86_64-${{ needs.submodule-hash.outputs.ghostty_hash }}-

      - name: Run tests
        working-directory: src/gdextension/terminal/ghostty-shim
        run: zig build test

  # ─── Build macOS universal binary (arm64 + x86_64) ─────────────────
  build-macos:
    needs: [submodule-hash, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          ZIG_VERSION="0.15.2"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   ZIG_PLATFORM="x86_64-linux" ;;
            Linux-aarch64)  ZIG_PLATFORM="aarch64-linux" ;;
            Darwin-x86_64)  ZIG_PLATFORM="x86_64-macos" ;;
            Darwin-arm64)   ZIG_PLATFORM="aarch64-macos" ;;
          esac
          curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_PLATFORM}-${ZIG_VERSION}.tar.xz"
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-${ZIG_PLATFORM}-${ZIG_VERSION}" >> $GITHUB_PATH
          zig version

      - name: Cache Zig build (arm64)
        uses: actions/cache@v4
        with:
          path: |
            src/gdextension/terminal/ghostty-shim/.zig-cache
          key: zig-macos-arm64-${{ needs.submodule-hash.outputs.ghostty_hash }}-${{ hashFiles('src/gdextension/terminal/ghostty-shim/build.zig', 'src/gdextension/terminal/ghostty-shim/build.zig.zon', 'src/gdextension/terminal/ghostty-shim/src/**') }}
          restore-keys: |
            zig-macos-arm64-${{ needs.submodule-hash.outputs.ghostty_hash }}-

      - name: Build arm64
        working-directory: src/gdextension/terminal/ghostty-shim
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
          cp zig-out/lib/libminerva-vt.dylib ../libminerva-vt-arm64.dylib

      - name: Build x86_64
        working-directory: src/gdextension/terminal/ghostty-shim
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
          cp zig-out/lib/libminerva-vt.dylib ../libminerva-vt-x86_64.dylib

      - name: Create universal binary
        working-directory: src/gdextension/terminal
        run: |
          lipo -create libminerva-vt-arm64.dylib libminerva-vt-x86_64.dylib \
               -output libminerva-vt.dylib
          echo "Universal binary info:"
          lipo -info libminerva-vt.dylib
          file libminerva-vt.dylib

      - name: Upload macOS universal dylib
        uses: actions/upload-artifact@v4
        with:
          name: minerva-vt-macos-universal
          path: src/gdextension/terminal/libminerva-vt.dylib

  # ─── Build Linux x86_64 ───────────────────────────────────────────
  build-linux:
    needs: [submodule-hash, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          ZIG_VERSION="0.15.2"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   ZIG_PLATFORM="x86_64-linux" ;;
            Linux-aarch64)  ZIG_PLATFORM="aarch64-linux" ;;
            Darwin-x86_64)  ZIG_PLATFORM="x86_64-macos" ;;
            Darwin-arm64)   ZIG_PLATFORM="aarch64-macos" ;;
          esac
          curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_PLATFORM}-${ZIG_VERSION}.tar.xz"
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-${ZIG_PLATFORM}-${ZIG_VERSION}" >> $GITHUB_PATH
          zig version

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: |
            src/gdextension/terminal/ghostty-shim/.zig-cache
            src/gdextension/terminal/ghostty-shim/zig-out
          key: zig-linux-x86_64-${{ needs.submodule-hash.outputs.ghostty_hash }}-${{ hashFiles('src/gdextension/terminal/ghostty-shim/build.zig', 'src/gdextension/terminal/ghostty-shim/build.zig.zon', 'src/gdextension/terminal/ghostty-shim/src/**') }}
          restore-keys: |
            zig-linux-x86_64-${{ needs.submodule-hash.outputs.ghostty_hash }}-

      - name: Build x86_64
        working-directory: src/gdextension/terminal/ghostty-shim
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux

      - name: Upload Linux shared library
        uses: actions/upload-artifact@v4
        with:
          name: minerva-vt-linux-x86_64
          path: src/gdextension/terminal/ghostty-shim/zig-out/lib/libminerva-vt.*

  # ─── Build full GDExtension with SCons (optional, Linux only) ──────
  build-gdextension-linux:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Linux minerva-vt
        uses: actions/download-artifact@v4
        with:
          name: minerva-vt-linux-x86_64
          path: src/gdextension/terminal/ghostty-shim/zig-out/lib/

      - name: Copy shim header to zig-out
        run: |
          mkdir -p src/gdextension/terminal/ghostty-shim/zig-out/include
          cp src/gdextension/terminal/ghostty-shim/src/minerva_vt.h \
             src/gdextension/terminal/ghostty-shim/zig-out/include/

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install scons

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential util-linux

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            src/godot-cpp/bin/**
            src/godot-cpp/gen/**
          key: ${{ runner.os }}-godot-cpp-${{ hashFiles('src/godot-cpp/**/*.cpp', 'src/godot-cpp/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-godot-cpp-

      - name: Build GDExtension (template_release)
        working-directory: src
        run: scons platform=linux target=template_release

      - name: Upload GDExtension
        uses: actions/upload-artifact@v4
        with:
          name: gdextension-linux-x86_64
          path: src/bin/libterminal*
