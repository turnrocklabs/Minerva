# tmux for agent sessions: invisible (no status line), no key delay, and a
# prefix that harness keybindings do not use (Ctrl-B is Claude Code's). The
# prefix is only needed to detach by hand; closing the Minerva tab detaches too.
set -g status off
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g extended-keys on
# mouse on: tmux asks the outer terminal for mouse input, and Minerva sends
# it wheel notches only (clicks and drags stay Minerva's own selection). On a
# shell pane the wheel enters copy-mode over this history; when the program
# in the pane tracks the mouse itself (Claude Code), tmux passes it the wheel.
set -g mouse on
unbind C-b
set -g prefix C-]
bind C-] send-prefix
bind d detach-client
