# Agent containers: agent.py (beside this file) drives it, one
# compose project per session (-p minerva-agent-<session name>).
#   gateway  the only thing that reaches host services: filtered MCP + egress
#            proxy on Unix sockets in that session's run directory. Host
#            network, and nothing else mounted: no repos, no credentials.
#   dev      the harness, long-running inside tmux: no network at all, host
#            uid, read-only root, per-session mounts (folders or their clones, harness
#            config dir, sockets, native build cache read-only) added by
#            agent.py at `compose run` time.
#            Minerva terminals attach with `docker exec ... tmux attach`.
#   job      one planned job (jobs.py, `agent.py run-job`): dev's hardening,
#            no network, CPU and memory limits set per job by agent.py
#            (MINERVA_JOB_CPUS, MINERVA_JOB_MEMORY), mounts per job.
# All three services sit in the "session" profile, so a bare `docker compose up`
# starts nothing half-configured. Build with `agent.py build`.
x-hardened: &hardened
  image: "${MINERVA_AGENT_IMAGE:?set by agent.py}"
  user: "${AGENT_UID:?set by agent.py}:${AGENT_GID:?set by agent.py}"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  labels:
    minerva.agent: "1"
  profiles: [session]

services:
  gateway:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDER_IMAGE: "${MINERVA_BUILDER_IMAGE:?set by agent.py}"
    network_mode: host
    pids_limit: 128
    mem_limit: 256m
    command: [python3, -B, /opt/minerva-agent/gateway/gateway.py,
              --config, /opt/minerva-agent/gateway/gateway.json,
              --sessions, /run/minerva-agent/sessions.json]

  dev:
    <<: *hardened
    network_mode: none
    # exec: Docker's tmpfs default is noexec, which breaks tests and builds
    # that run helpers they write under /tmp or HOME.
    tmpfs:
      - /tmp:size=2g,mode=1777,exec
      - /home/agent:size=512m,mode=1777,exec
    pids_limit: 1024
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4
    restart: "no"
    command: [/opt/minerva-agent/minerva-session]

  job:
    <<: *hardened
    network_mode: none
    tmpfs:
      - /tmp:size=2g,mode=1777,exec
      - /home/agent:size=512m,mode=1777,exec
    pids_limit: 1024
    cpus: "${MINERVA_JOB_CPUS:-1}"
    mem_limit: "${MINERVA_JOB_MEMORY:-2g}"
    memswap_limit: "${MINERVA_JOB_MEMORY:-2g}"
    restart: "no"
