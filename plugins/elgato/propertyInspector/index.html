<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Minerva Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      color: #d8d8d8;
      background: #2d2d2d;
      margin: 0;
      padding: 12px;
    }
    .sdpi-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sdpi-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sdpi-item-label {
      width: 80px;
      text-align: right;
      color: #969696;
      flex-shrink: 0;
    }
    .sdpi-item-value {
      flex: 1;
    }
    input[type="text"], input[type="number"] {
      background: #3b3b3b;
      border: 1px solid #4a4a4a;
      border-radius: 3px;
      color: #d8d8d8;
      padding: 4px 8px;
      width: 100%;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #0078d4;
      outline: none;
    }
    .sdpi-heading {
      font-size: 11px;
      font-weight: 600;
      color: #969696;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #3b3b3b;
    }
    .sdpi-status {
      padding: 6px 8px;
      border-radius: 3px;
      font-size: 11px;
    }
    .sdpi-status.connected {
      background: #1a3a1a;
      color: #6ec66e;
    }
    .sdpi-status.disconnected {
      background: #3a1a1a;
      color: #c66e6e;
    }
    .sdpi-info {
      color: #808080;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-heading">Minerva Connection</div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Host</div>
      <div class="sdpi-item-value">
        <input type="text" id="host" value="127.0.0.1" placeholder="127.0.0.1" />
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Port</div>
      <div class="sdpi-item-value">
        <input type="number" id="port" value="7778" min="1024" max="65535" />
      </div>
    </div>

    <div id="status" class="sdpi-status disconnected">
      Not connected to Minerva
    </div>

    <div class="sdpi-heading" style="margin-top: 12px;">Info</div>
    <div class="sdpi-info">
      Enable the Stream Deck server in Minerva's Preferences &gt; Voice tab.
      The plugin will auto-connect when Minerva is running.
    </div>
  </div>

  <script>
    // Property Inspector ↔ Plugin communication via Stream Deck WebSocket
    let websocket = null;
    let pluginUUID = null;
    let actionInfo = null;

    function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
      pluginUUID = inPluginUUID;
      actionInfo = inActionInfo ? JSON.parse(inActionInfo) : null;

      websocket = new WebSocket("ws://127.0.0.1:" + inPort);
      websocket.onopen = function() {
        websocket.send(JSON.stringify({
          event: inRegisterEvent,
          uuid: inPluginUUID
        }));

        // Request current settings
        if (actionInfo) {
          websocket.send(JSON.stringify({
            event: "getSettings",
            context: actionInfo.context
          }));
        }
      };

      websocket.onmessage = function(evt) {
        var msg = JSON.parse(evt.data);
        if (msg.event === "didReceiveSettings" && msg.payload && msg.payload.settings) {
          loadSettings(msg.payload.settings);
        }
        if (msg.event === "sendToPropertyInspector" && msg.payload) {
          handlePluginMessage(msg.payload);
        }
      };
    }

    function loadSettings(settings) {
      if (settings.host) document.getElementById("host").value = settings.host;
      if (settings.port) document.getElementById("port").value = settings.port;
    }

    function handlePluginMessage(payload) {
      if (payload.minervaConnected !== undefined) {
        var el = document.getElementById("status");
        if (payload.minervaConnected) {
          el.className = "sdpi-status connected";
          el.textContent = "Connected to Minerva";
        } else {
          el.className = "sdpi-status disconnected";
          el.textContent = "Not connected to Minerva";
        }
      }
    }

    function saveSettings() {
      if (!websocket || !actionInfo) return;
      var settings = {
        host: document.getElementById("host").value || "127.0.0.1",
        port: parseInt(document.getElementById("port").value) || 7778
      };
      websocket.send(JSON.stringify({
        event: "setSettings",
        context: actionInfo.context,
        payload: settings
      }));
    }

    document.getElementById("host").addEventListener("change", saveSettings);
    document.getElementById("port").addEventListener("change", saveSettings);
  </script>
</body>
</html>
