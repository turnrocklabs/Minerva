<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>godot-cef spike</title>
<style>
body { font-family: system-ui, sans-serif; padding: 20px; background: #1e2430; color: #eee; }
h1 { font-size: 20px; }
label { display: block; margin: 12px 0 4px; font-size: 13px; }
input { font-size: 14px; padding: 6px 10px; width: 280px; background: #2a3140; color: #eee; border: 1px solid #3a4150; border-radius: 4px; }
input:focus { outline: 2px solid #5aa0ff; border-color: #5aa0ff; }
button { margin-top: 16px; padding: 6px 14px; background: #5aa0ff; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
button:hover { background: #7ab4ff; }
#status { margin-top: 16px; padding: 8px; background: #242a38; border-radius: 4px; font-family: monospace; font-size: 12px; min-height: 40px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>godot-cef spike</h1>
<p>Gate tests: caret, typing, IPC round-trip.</p>

<label for="txt">Text input (Gates 1+2 — caret visible, typing works)</label>
<input id="txt" type="text" placeholder="click and type">

<label for="pw">Password input (same)</label>
<input id="pw" type="password" placeholder="click and type"> <button type="button" id="pw-show" style="padding:4px 10px">Show</button>

<div style="margin-top:16px; padding:8px; background:#242a38; border-radius:4px; font-size:12px;">
  <strong>Paste-doubling gate:</strong> clear a field, Ctrl+V once, observe logged length vs clipboard length. They should match (1×), not double (2×).
</div>

<button id="ipc-btn">Send IPC to Godot (Gate 3)</button>
<button type="button" id="clear-btn" style="margin-left:8px; background:#888;">Clear inputs + log</button>

<div id="status">status: waiting...</div>

<script>
const statusEl = document.getElementById('status');
const btn = document.getElementById('ipc-btn');

function logStatus(msg) {
  const t = new Date().toLocaleTimeString();
  statusEl.textContent = `[${t}] ${msg}\n` + statusEl.textContent;
}

btn.addEventListener('click', () => {
  const txtVal = document.getElementById('txt').value;
  const pwVal = document.getElementById('pw').value;
  const payload = {
    type: 'spike_test',
    txt: txtVal,
    pw_len: pwVal.length
  };

  console.log('[spike] button clicked, probing ipc variants');
  logStatus('--- button click ---');

  // godot-cef JS API (from binary strings + addListener pattern):
  //   sendIpcMessage     — probably (eventName, payload) for typed IPC
  //   sendIpcBinaryMessage — binary
  //   sendIpcData        — alternate data path
  // Try multiple call shapes; each one fires or throws and we log the result.
  function tryCall(desc, fn) {
    try {
      const r = fn();
      logStatus(`${desc} OK, returned: ${r === undefined ? 'undefined' : r}`);
    } catch (e) {
      logStatus(`${desc} THREW: ${e.message || e}`);
    }
  }

  if (typeof window.sendIpcMessage === 'function') {
    tryCall("sendIpcMessage(name, payload)",
      () => window.sendIpcMessage('spike_test', payload));
    tryCall("sendIpcMessage(payload) single-arg",
      () => window.sendIpcMessage(payload));
    tryCall("sendIpcMessage(string)",
      () => window.sendIpcMessage(JSON.stringify(payload)));
  } else {
    logStatus('window.sendIpcMessage is not a function');
  }

  if (typeof window.sendIpcData === 'function') {
    tryCall("sendIpcData('spike_test', payload)",
      () => window.sendIpcData('spike_test', payload));
  }
  if (typeof window.sendIpcBinaryMessage === 'function') {
    tryCall("sendIpcBinaryMessage(bytes)",
      () => window.sendIpcBinaryMessage(new Uint8Array([1,2,3,4])));
  }

  // Also log what IPC-ish functions actually exist
  const keys = Object.getOwnPropertyNames(window).filter(
    k => /ipc|godot|cef/i.test(k)
  );
  logStatus('window IPC-ish keys: ' + keys.join(', '));
});

// Also expose a function for Godot → JS eval to call
window.spike_from_godot = function(msg) {
  logStatus('received from Godot: ' + msg);
};

// Paste-doubling gate: log paste + input events on both fields so we can
// directly observe whether the first Ctrl+V after focus commits once or twice.
['txt', 'pw'].forEach((id) => {
  const el = document.getElementById(id);
  el.addEventListener('paste', (e) => {
    const clip = (e.clipboardData && e.clipboardData.getData('text')) || '';
    logStatus(`[${id}] paste event: clipboard len=${clip.length} content="${clip.slice(0,24)}${clip.length>24?'…':''}"`);
    // Read .value on next tick so we see the post-paste DOM value
    setTimeout(() => {
      const v = el.value;
      const doubled = clip.length > 0 && v.length === clip.length * 2;
      logStatus(`[${id}] post-paste value len=${v.length} ${doubled ? '❌ DOUBLED' : '✓ single'} | value="${v.slice(0,48)}${v.length>48?'…':''}"`);
    }, 0);
  });
  el.addEventListener('input', (e) => {
    logStatus(`[${id}] input event: value len=${el.value.length} inputType=${e.inputType || '?'}`);
  });
  el.addEventListener('focus', () => logStatus(`[${id}] focus`));
  el.addEventListener('blur', () => logStatus(`[${id}] blur`));
});

document.getElementById('pw-show').addEventListener('click', () => {
  const pw = document.getElementById('pw');
  const btn = document.getElementById('pw-show');
  if (pw.type === 'password') { pw.type = 'text'; btn.textContent = 'Hide'; }
  else { pw.type = 'password'; btn.textContent = 'Show'; }
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('txt').value = '';
  document.getElementById('pw').value = '';
  statusEl.textContent = '';
  logStatus('cleared');
});

logStatus('page loaded');
</script>
</body>
</html>
