<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Wand stick - diagonal from bottom-left to top-right -->
  <rect x="6" y="6" width="14" height="3" rx="1" fill="#e0e0e0" transform="rotate(-45 13 7.5)"/>

  <!-- Sparkles at the bottom-left tip (active selection point) -->
  <circle cx="5" cy="19" r="1.5" fill="#e0e0e0"/>
  <line x1="5" y1="15" x2="5" y2="17" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="21" x2="5" y2="23" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1" y1="19" x2="3" y2="19" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="19" x2="9" y2="19" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small sparkle accents -->
  <circle cx="2" cy="15" r="1" fill="#e0e0e0"/>
  <circle cx="9" cy="22" r="1" fill="#e0e0e0"/>
</svg>
